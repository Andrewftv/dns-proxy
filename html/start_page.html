<!DOCTYPE html>
<html lang="en">
  <head>
    <link rel="stylesheet" href="classes.css" type="text/css">
    <meta charset="utf-8">
    <title>DNS AdCleaner</title>
    <style>
      .callout {
        position: fixed;
        bottom: 35px;
        right: 20px;
        margin-left: 200px;
        min-width: fit-content;
        height: fit-content;
        border-radius: 8px;
        background-color: darkseagreen;
      }

      .callout-container {
        padding: 10px;
        color: white;
        margin: 0;
      }

    </style>
  </head>
  <body>
    <div class="container">
      <div class="menu">
        <p><a href="/">Home</a></p>
        <p><a href="statistics.html">Rejects</a></p>
        <p><a href="tpool_stats.html">Performance</a></p>
        <p><a href="about.html">About</a></p>
      </div>
      <div class="header">
        <img src="images/banner.png" alt="Main banner" width="500px">
      </div>
      <div class="content">
        <table>
          <tr>
            <td>Update filter</td>
            <td>
              <form action="update_filter" method="post">
                <button class="mysubmit" id="ipdate_filter_id">Send</button>
              </form>
            </td>
          </tr>
          <tr>
            <td>Reload filter</td>
            <td>
              <form action="reload_filter" method="post">
                <button class="mysubmit" id="reload_filter_id">Send</button>
              </form>
            </td>
          </tr>
          <tr>
            <td>DNS server: {#DNSSRV}</td>
            <td><a href="change_ip.html" class="button">Change</a></td>
          </tr>
        </table>
      </div>
    </div>

    <div {#HIDE_POPUP} class="callout" id="myCallout">
      <p class="callout-container">{#FILTER_STATUS}</p>
    </div>

    <script>
      function hidePopup() {
      var popup = document.getElementById("myCallout");
      popup.style.display='none';
    }

    var popup = document.getElementById("myCallout");
    setTimeout(hidePopup, 3000);
    </script>

  </body>
</html>

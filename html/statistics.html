<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>DNS AdCleaner</title>
    <link rel="stylesheet" href="classes.css" type="text/css">
    <style>
  /* Define the style for your custom highlight */
    ::highlight(search-match) {
      background-color: yellow;
      color: black;
    }
    ::highlight(current-match) {
      background-color: orange;
      color: black;
      font-weight: bold;
    }
    .switch {
      margin-top: 5px;
      margin-left: 10px;
      position: relative;
      display: inline-block;
      width: 50px;
      height: 24px;
    }

    .switch input { 
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: #ccc;
      -webkit-transition: .4s;
      transition: .4s;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 20px;
      width: 20px;
      left: 2px;
      bottom: 2px;
      background-color: white;
      -webkit-transition: .4s;
      transition: .4s;
    }

    input:checked + .slider {
      background-color: #2196F3;
    }

    input:focus + .slider {
      box-shadow: 0 0 1px #2196F3;
    }

    input:checked + .slider:before {
      -webkit-transform: translateX(26px);
      -ms-transform: translateX(26px);
      transform: translateX(26px);
    }
    /* Rounded sliders */
    .slider.round {
      border-radius: 34px;
    }
    .slider.round:before {
      border-radius: 50%;
    }
  </style>
  </head>
  <body>
    <div class="container">
      <div class="menu">
        <p><a href="/">Home</a></p>
        <p><a href="local_dns.html">Local DNS</a></p>
        <p><a href="statistics.html">Rejects</a></p>
        <p><a href="tpool_stats.html">Performance</a></p>
        <p><a href="about.html">About</a></p>  
      </div>
      <div class="header">
        <h2>Reject statistics</h2>
      </div>
        <div class="contant" id="searchableContainer" style="display: flex; gap: 15px;">
        <div id="tableContainer">
          <table>
            <tr><th>Enable</th><th>Filter</th><th>Name</th><th>Count</th></tr>
            {#REJECT_STATISTICS}
          </table>
        </div>
        <div class="search-box" style="padding: 15px;">
          <input type="text" id="divSearchInput" placeholder="Find text...">
          <button id="searchBtn">Find Next</button>
          <span id="matchCount"></span>
        </div>
      </div>
    </div>
    <script>
      const input = document.getElementById('divSearchInput');
      const btn = document.getElementById('searchBtn');
      const container = document.getElementById('searchableContainer');
      const matchCountSpan = document.getElementById('matchCount');
      const div_cont = document.getElementById('tableContainer');

      div_cont.addEventListener('change', async (event) => {
        const isEnabled = event.target.checked;
        var status = 'off';
        if (isEnabled) {
          status = 'on';
        } 
        const name = event.target.name;
        console.info("--- CATCHED: name " + name + "checked " + isEnabled);
        const response = await fetch('/enable_names', {
          method: 'POST',
          body: (name + '=' + status)
        });
        if (!response.ok) {
          console.info("--- FAILED");
          event.target.checked = !isEnabled;
        }
      });

      let matches = [];
      let currentMatchIndex = -1;

      // 1. Find all text nodes inside the target div
      function getTextNodes(node) {
        const textNodes = [];
        const walk = document.createTreeWalker(node, NodeFilter.SHOW_TEXT, null, false);
        let currentNode;
        while (currentNode = walk.nextNode()) {
          textNodes.push(currentNode);
        }
        return textNodes;
      }
      // 2. Perform the scoped search
      function performSearch() {
        // Clear previous highlights
        CSS.highlights.clear();
        matches = [];
        currentMatchIndex = -1;
        matchCountSpan.textContent = "";

        const query = input.value.toLowerCase();
        if (!query) return;

        const textNodes = getTextNodes(container);
        const ranges = [];

        textNodes.forEach(node => {
          const text = node.textContent.toLowerCase();
          let startIdx = text.indexOf(query);

          while (startIdx !== -1) {
            const range = new Range();
            range.setStart(node, startIdx);
            range.setEnd(node, startIdx + query.length);
            ranges.push(range);
            
            // Find next occurrence in the same text node
            startIdx = text.indexOf(query, startIdx + query.length);
          }
        });

        if (ranges.length > 0) {
          matches = ranges;
          
          // Register all matches to the CSS Highlight API
          const searchMatchHighlight = new Highlight(...ranges);
          CSS.highlights.set("search-match", searchMatchHighlight);
          
          // Go to first match
          goToMatch(0);
        } else {
          matchCountSpan.textContent = "0 matches";
        }
      }
      // 3. Cycle through matches (Find Next functionality)
    function goToMatch(index) {
      if (matches.length === 0) return;

      currentMatchIndex = index;
      
      // Update counter text
      matchCountSpan.textContent = `${currentMatchIndex + 1} of ${matches.length}`;

      // Highlight the active single match differently
      const currentRange = matches[currentMatchIndex];
      const currentHighlight = new Highlight(currentRange);
      CSS.highlights.set("current-match", currentHighlight);

      // Smoothly scroll the matched item into view
      currentRange.startContainer.parentElement.scrollIntoView({
        behavior: 'smooth',
        block: 'center'
      });
    }

    // Event Listeners
    input.addEventListener('input', performSearch);
    
    btn.addEventListener('click', () => {
      if (matches.length === 0) return;
      let nextIndex = currentMatchIndex + 1;
      if (nextIndex >= matches.length) nextIndex = 0; // Loop back to start
      goToMatch(nextIndex);
    });
    </script>
  </body>
</html>
